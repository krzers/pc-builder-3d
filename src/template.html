<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>จัดสเปคคอม 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: workshop bench. slot rail (what is installed) | full 3D stage | parts shelf of picture cards */
  --bg:#e7e7e1; --surface:#f5f5f0; --card:#ffffff; --line:#cdcdc3;
  --ink:#121310; --ink-2:#5a5c54; --ink-3:#8b8d83;
  --hi:#ffd60a; --hi-ink:#121310;
  --ok:#11795a; --ok-soft:#dcf1e8; --warn:#8f5600; --warn-soft:#fbeed3; --bad:#c32d28; --bad-soft:#fbe5e3;
  --bench-a:#f6f6f1; --bench-b:#d6d6ce; --pic-a:#f1f1ec; --pic-b:#d9d9d1;
  --display:"Anuphan","IBM Plex Sans Thai",system-ui,sans-serif;
  --body:"IBM Plex Sans Thai","Anuphan",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){color-scheme:dark;
    --bg:#0d0e0c; --surface:#151613; --card:#1c1e1a; --line:#31342d;
    --ink:#f2f3ec; --ink-2:#a8ab9e; --ink-3:#74776b;
    --hi:#ffd60a; --hi-ink:#121310;
    --ok:#56d3a3; --ok-soft:#12301f; --warn:#f0b558; --warn-soft:#352810; --bad:#ff8179; --bad-soft:#3a1716;
    --bench-a:#262822; --bench-b:#0b0c0a; --pic-a:#2c2e28; --pic-b:#191a17;}
}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0d0e0c; --surface:#151613; --card:#1c1e1a; --line:#31342d;
  --ink:#f2f3ec; --ink-2:#a8ab9e; --ink-3:#74776b;
  --hi:#ffd60a; --hi-ink:#121310;
  --ok:#56d3a3; --ok-soft:#12301f; --warn:#f0b558; --warn-soft:#352810; --bad:#ff8179; --bad-soft:#3a1716;
  --bench-a:#262822; --bench-b:#0b0c0a; --pic-a:#2c2e28; --pic-b:#191a17;}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
@property --acc{syntax:'<color>';inherits:true;initial-value:#5b6cff}
.app{--acc:#5b6cff;--acc-ink:#fff;--hi:var(--acc);--hi-ink:var(--acc-ink);height:100%;display:grid;grid-template-columns:92px minmax(0,1fr) 480px;min-height:0;transition:grid-template-columns .38s cubic-bezier(.2,.8,.2,1),grid-template-rows .38s cubic-bezier(.2,.8,.2,1),--acc .7s ease}
.app.fold{grid-template-columns:92px minmax(0,1fr) 0px}
.app.fold .panel{border-left-color:transparent}
.fold-h{position:absolute;right:0;top:50%;transform:translateY(-50%);z-index:6;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-right:0;border-radius:10px 0 0 10px;padding:14px 8px 14px 10px;font-size:13px;font-weight:600;box-shadow:-6px 0 18px rgba(0,0,0,.08)}
.fold-h:hover{background:var(--hi);color:var(--hi-ink);border-color:var(--ink)}
.fold-h svg{transition:transform .3s}
.app.fold .fold-h svg{transform:rotate(180deg)}
.fold-h span{display:none;writing-mode:vertical-rl}
.app.fold .fold-h span{display:block}

/* slot rail */
.rail{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px;background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.logo{width:40px;height:40px;border-radius:8px;background:var(--ink);display:grid;place-items:center;margin-bottom:6px;flex:none}
.logo::after{content:"";width:16px;height:20px;border:2.5px solid var(--hi);border-radius:2px;box-shadow:inset 0 -6px 0 -2px var(--hi)}
.slots{display:contents}
.slot{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:2px;width:72px;flex:none}
.slot .sq{width:56px;height:56px;border-radius:8px;border:1.5px dashed var(--line);display:grid;place-items:center;position:relative;overflow:hidden;background:var(--bg);transition:transform .15s,border-color .15s}
.slot .sq b{font-family:var(--mono);font-size:15px;color:var(--ink-3)}
.slot .sq img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot .sq img:not([src]){visibility:hidden}
.slot.full .sq{border-style:solid;background:linear-gradient(160deg,var(--pic-a),var(--pic-b))}
.slot.full .sq b{position:absolute;left:3px;top:2px;font-size:10.5px;color:var(--ink-2)}
.slot .lb{font-size:11.5px;color:var(--ink-2);line-height:1.3;text-align:center}
.slot:hover:not(:disabled) .sq{transform:translateY(-2px);border-color:var(--ink-3)}
.slot.cur .sq{border:2.5px solid var(--ink);box-shadow:0 0 0 3px var(--c,var(--hi)),0 6px 18px color-mix(in srgb,var(--c,var(--hi)) 45%,transparent)}
.slot.full .sq::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--c)}
.slot.just .sq{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.slot.cur .lb{color:var(--ink);font-weight:600}
.slot:disabled{opacity:.4;cursor:default}
.rail .sp{flex:1;min-height:6px}
.mini{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:5px 8px;font-size:12px;width:72px;flex:none}
.mini:hover{border-color:var(--ink)}

/* stage */
.bench{position:relative;min-height:0;min-width:0;background:radial-gradient(110% 85% at 50% 38%,var(--bench-a),var(--bench-b));overflow:hidden}
.bench canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.bench canvas:active{cursor:grabbing}
.bench::after{content:"";position:absolute;inset:10px;border:2.5px dashed var(--ink);border-radius:14px;opacity:0;transition:opacity .15s;pointer-events:none}
.bench.drop::after{opacity:.8}
.bench.eject::after{opacity:.9;border-color:var(--bad)}
.stagemsg{position:absolute;left:50%;top:18px;transform:translate(-50%,-8px);background:var(--ink);color:var(--bg);font-weight:600;padding:8px 16px;border-radius:8px;opacity:0;transition:opacity .15s,transform .15s;pointer-events:none;white-space:nowrap;z-index:4;font-size:14px}
.bench.drop .stagemsg,.bench.pull .stagemsg{opacity:1;transform:translate(-50%,0)}
.bench.eject .stagemsg{background:var(--bad);color:#fff}
.viewbtn{position:absolute;top:10px;right:12px;width:auto}
.hud{position:absolute;left:16px;bottom:16px;right:16px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;pointer-events:none}
.gauge{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:8px;padding:9px 14px;min-width:240px;max-width:340px;box-shadow:0 8px 28px rgba(0,0,0,.1)}
.gauge .l{font-size:12.5px;color:var(--ink-2)}
.gauge .v{font-family:var(--mono);font-weight:600;font-size:20px;margin:0 0 6px}
.gauge .v small{font-weight:500;font-size:13px;color:var(--ink-2)}
.bar{height:6px;background:var(--bg);position:relative;overflow:hidden;border-radius:2px}
.bar span{position:absolute;inset:0 auto 0 0;background:var(--ok);animation:grow .7s cubic-bezier(.2,.8,.2,1)}
@keyframes grow{from{width:0}}
.gauge{animation:rise .35s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.gauge.warn{border-left-color:var(--warn)}.gauge.warn .bar span{background:var(--warn)}
.gauge.bad{border-left-color:var(--bad)}.gauge.bad .bar span{background:var(--bad)}.gauge.bad .v{color:var(--bad)}
.gauge.plain{border-left-color:var(--ink)}
.gauge .s{font-size:12.5px;margin-top:6px;color:var(--ink-2)}
.gauge.bad .s{color:var(--bad)}.gauge.warn .s{color:var(--warn)}
.empty3d{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--ink-2);pointer-events:none;padding:24px}
.empty3d b{display:block;font-family:var(--display);font-size:22px;color:var(--ink)}
.toast{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13.5px;max-width:min(520px,calc(100% - 32px));opacity:0;transition:opacity .2s;pointer-events:none;text-align:center;z-index:5}
.toast{transform:translate(-50%,12px);transition:opacity .25s,transform .3s cubic-bezier(.2,.8,.2,1)}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* shelf */
.panel{display:grid;grid-template-rows:auto 1fr auto;min-height:0;min-width:0;overflow:hidden;background:var(--surface);border-left:1px solid var(--line)}
.panel>*{min-width:480px}
.ph{padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.prog{display:flex;gap:4px;margin-bottom:14px}
.prog i{flex:1;height:3px;border-radius:2px;background:var(--line)}
.prog i.d{background:var(--ink)}.prog i.c{background:var(--hi);box-shadow:0 0 0 1px var(--ink)}
.ph .eb{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--ink-2);font-family:var(--mono)}
.ph .eb em{font-style:normal;font-family:var(--body);letter-spacing:0;font-weight:500;background:var(--hi);color:var(--hi-ink);padding:1px 8px;border-radius:3px;font-size:11.5px}
.ph h1{font-family:var(--display);font-size:26px;line-height:1.2;margin:4px 0 6px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.ph p{margin:0;color:var(--ink-2);font-size:14px;line-height:1.55;max-width:44ch}
.ph .cnt{display:flex;gap:14px;margin-top:12px;font-size:12.5px;color:var(--ink-2)}
.ph .cnt b{font-family:var(--mono);font-weight:600;color:var(--ink);margin-right:4px}
.ph .cnt .x b{color:var(--bad)}
.list{overflow-y:auto;padding:14px;min-height:0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.sec{grid-column:1/-1;font-size:12.5px;font-weight:600;color:var(--ink-2);margin:8px 2px 0;display:flex;align-items:center;gap:8px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.skip{grid-column:1/-1;font-size:13px;color:var(--ok);background:var(--ok-soft);border-radius:6px;padding:7px 10px;display:flex;gap:8px;align-items:flex-start}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:grab;position:relative;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-y;
  transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s,border-color .15s,opacity .45s}
.card.pre{opacity:0;transform:translateY(22px) scale(.96)}
.card.pre.in{opacity:1;transform:none;transition:transform .5s cubic-bezier(.2,.8,.2,1) var(--d,0ms),opacity .45s var(--d,0ms),box-shadow .22s,border-color .15s}
.card:hover{transform:translateY(-4px);box-shadow:0 14px 28px color-mix(in srgb,var(--acc) 28%,rgba(0,0,0,.12));border-color:var(--acc)}
.card:active{transform:translateY(-1px) scale(.985)}
.card.pre.in:hover{transform:translateY(-3px);transition-delay:0ms}
.pic{aspect-ratio:4/3;background:radial-gradient(120% 90% at 30% 10%,color-mix(in srgb,var(--acc) 16%,var(--pic-a)),var(--pic-b));position:relative;overflow:hidden}
.pic::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.25) 50%,transparent 70%);transform:translateX(-100%);animation:sh 1.4s infinite}
.pic.ready::before{display:none}
@keyframes sh{to{transform:translateX(100%)}}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:transform .35s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.pic img:not([src]){visibility:hidden}
.card:hover .pic img{transform:scale(1.07)}
.fmt{position:absolute;left:8px;bottom:8px;font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.02em;background:var(--ink);color:var(--bg);padding:2px 7px;border-radius:3px;max-width:calc(100% - 16px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fmts{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;align-items:stretch}
.fmts .fl{flex-basis:100%;font-size:12px;color:var(--ink-2);font-weight:500}
.fm{flex:1 1 0;min-width:84px;display:grid;grid-template-rows:30px auto auto;justify-items:center;align-items:end;gap:1px;padding:8px 6px 7px;background:var(--card);border:1px solid var(--line);border-radius:8px;line-height:1.25}
.fm i{display:block;border:1.5px solid var(--ink);border-radius:2px;background:var(--pic-b);align-self:end;margin-bottom:4px}
.fm b{font-family:var(--mono);font-size:12px;font-weight:600}
.fm small{font-size:10.5px;color:var(--ink-2)}
.fm:hover:not(:disabled){border-color:var(--ink)}
.fm.on{border:2px solid var(--ink);box-shadow:0 0 0 2px var(--hi)}.fm.on i{background:var(--hi)}
.fm.na{opacity:.55;border-style:dashed}.fm.na small{color:var(--bad)}
.fm:disabled{opacity:.3;cursor:default}
.tag{position:absolute;left:8px;top:8px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:4px;display:flex;gap:5px;align-items:center}
.tag.on{background:var(--hi);color:var(--hi-ink)}
.tag.no{background:var(--bad);color:#fff}
.grip{position:absolute;right:8px;top:8px;font-size:11px;color:var(--ink-2);background:var(--card);border:1px solid var(--line);border-radius:4px;padding:1px 6px;opacity:0;transition:opacity .15s}
.card:hover .grip{opacity:1}
.tx{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;flex:1}
.tx .n{font-weight:600;font-size:14.5px;line-height:1.3;overflow-wrap:anywhere}
.tx .sub{font-size:12.5px;color:var(--ink-2)}
.tx dl{margin:8px 0 0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12.5px;border-top:1px solid var(--line);padding-top:8px}
.tx dt{color:var(--ink-2)}.tx dd{margin:0;text-align:right;font-family:var(--mono);font-size:12px;font-weight:500}
.card.sel{border:2px solid var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 25%,transparent)}
.card.sel .tag.on{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.card.sel .pic::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);transform:translateX(-120%);animation:sheen .9s .1s ease-out 1}
@keyframes sheen{to{transform:translateX(120%)}}
.card.lock{cursor:pointer;background:var(--surface)}
.card.lock .pic img{filter:grayscale(1);opacity:.45}
.card.lock .pic::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 9px,color-mix(in srgb,var(--bad) 16%,transparent) 9px 11px)}
.card.lock .n,.card.lock .sub,.card.lock dl{opacity:.6}
.card.lock.pv{border:2px solid var(--bad)}
.why,.note{margin-top:8px;font-size:12.5px;display:flex;gap:6px;align-items:flex-start;line-height:1.45}
.why{color:var(--bad)}.note{color:var(--warn)}
.why svg,.note svg,.skip svg{flex:none;margin-top:3px}
.see{font-size:12px;color:var(--ink-2);margin-top:4px;text-decoration:underline;text-underline-offset:3px}
.pf{display:flex;gap:10px;padding:12px 14px;border-top:1px solid var(--line)}
.btn{flex:1;border:0;border-radius:8px;padding:12px 16px;font-weight:600;font-size:15px;background:var(--ink);color:var(--bg);transition:transform .12s,background .2s,color .2s,box-shadow .2s;position:relative;overflow:hidden}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.go{animation:nudge .6s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 55%,transparent)}
@keyframes nudge{0%{transform:scale(.96)}50%{transform:scale(1.03)}100%{transform:scale(1)}}
#next:not(:disabled):not(.cp)::after{content:"→";display:inline-block;margin-left:8px;transition:transform .2s}
#next:not(:disabled):hover::after{transform:translateX(5px)}
.ph{position:relative}
.ph h1{display:flex;align-items:center;gap:10px}
.ph h1::before{content:"";flex:none;width:8px;height:24px;border-radius:2px;background:var(--acc)}
.ph.enter h1,.ph.enter p,.ph.enter .cnt,.ph.enter .fmts{animation:slidein .45s cubic-bezier(.2,.8,.2,1) both}
.ph.enter p{animation-delay:.05s}.ph.enter .cnt{animation-delay:.1s}.ph.enter .fmts{animation-delay:.14s}
@keyframes slidein{from{opacity:0;transform:translateX(14px)}}
.bench::before{content:"";position:absolute;inset:0;background:radial-gradient(62% 58% at 50% 56%,color-mix(in srgb,var(--acc) 13%,transparent),transparent 74%);pointer-events:none}
#fx{position:absolute;inset:0;pointer-events:none;opacity:0}
#fx.ok{background:radial-gradient(60% 60% at 50% 50%,color-mix(in srgb,var(--acc) 30%,transparent),transparent 75%);animation:flash .6s ease-out}
#fx.bad{box-shadow:inset 0 0 120px 30px color-mix(in srgb,var(--bad) 55%,transparent);animation:flash .5s ease-out}
@keyframes flash{0%{opacity:0}18%{opacity:1}100%{opacity:0}}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
.verdict{animation:rise .5s cubic-bezier(.2,.8,.2,1)}
.sum .row{animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
.btn:not(:disabled):hover{background:var(--hi);color:var(--hi-ink)}
.btn:disabled{background:none;color:var(--ink-3);cursor:default;border:1px dashed var(--line)}
.btn.sec2{flex:0 0 auto;background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.sec2:hover{border-color:var(--ink);background:var(--card);color:var(--ink)}
#dragghost{position:fixed;left:0;top:0;z-index:50;width:250px;pointer-events:none;will-change:transform}
#dragghost img{display:block;width:100%;filter:drop-shadow(0 18px 16px rgba(0,0,0,.35));animation:lift .18s cubic-bezier(.2,.8,.2,1)}
#dragghost .nm{display:inline-block;background:var(--ink);color:var(--bg);font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:6px}
@keyframes lift{from{transform:scale(.6);opacity:.3}}
body.dragging,body.dragging *{cursor:grabbing!important}

.sum{display:flex;flex-direction:column;gap:10px}
.verdict{border-radius:8px;padding:12px 14px;background:var(--ok-soft);color:var(--ok);font-weight:600;display:flex;gap:10px;align-items:center}
.row{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:8px 2px;border-bottom:1px solid var(--line);font-size:14px}
.row .th{width:56px;height:44px;border-radius:6px;background:linear-gradient(160deg,var(--pic-a),var(--pic-b));position:relative;overflow:hidden}
.row .th img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.row .th img:not([src]){visibility:hidden}
.row .x{font-weight:600;overflow-wrap:anywhere;line-height:1.35}
.row .x small{display:block;font-weight:400;color:var(--ink-2);font-size:12.5px}
.row button{background:none;border:0;font-size:13px;padding:0;text-decoration:underline;text-underline-offset:3px}
.checks{margin:4px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.checks li{display:flex;gap:8px;align-items:flex-start}
.checks svg{flex:none;margin-top:4px;color:var(--ok)}
.fine{font-size:12.5px;color:var(--ink-3);margin:6px 2px 0}.fine a{color:inherit}
h2{font-family:var(--display);font-size:15px;margin:10px 2px 0;font-weight:600}

@media (max-width:980px){
  .app{grid-template-columns:1fr;grid-template-rows:auto minmax(210px,36%) 1fr}
  .app.fold{grid-template-columns:1fr;grid-template-rows:auto 1fr 0px}
  .panel>*{min-width:0}
  .fold-h{right:50%;top:auto;bottom:0;transform:translateX(50%);border:1px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;padding:5px 16px}
  .fold-h svg{transform:rotate(90deg)}.app.fold .fold-h svg{transform:rotate(-90deg)}
  .fold-h span,.app.fold .fold-h span{display:block;writing-mode:horizontal-tb}
  .hud{bottom:38px}
  .rail{flex-direction:row;border-right:0;border-bottom:1px solid var(--line);padding:8px 10px;overflow-x:auto;overflow-y:hidden;align-items:flex-start}
  .logo,.rail .sp{display:none}
  .slot{width:54px}.slot .sq{width:44px;height:44px}.slot .lb{font-size:10.5px}
  .mini{width:auto;align-self:center;white-space:nowrap}
  .panel{border-left:0;border-top:1px solid var(--line)}
